[project]
name = "archon-api"
version = "0.1.0"
description = "ARCHON — AI Engineering Intelligence Platform (API)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.35",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.7",
  "networkx>=3.3",
  "pathspec>=0.12",
  "google-genai>=1.0",
  "openai>=1.50",
  "httpx>=0.27",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["archon*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Rule tables, prompts and finding texts are long literal strings; wrapping them hurts readability.
"archon/analysis/*.py" = ["E501"]
"archon/services/reasoning.py" = ["E501"]
"archon/services/docs.py" = ["E501"]
"archon/services/stacktrace.py" = ["E501"]
"tests/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
